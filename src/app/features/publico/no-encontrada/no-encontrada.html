<section
  class="relative mx-auto mt-2 max-w-3xl overflow-hidden rounded-3xl bg-musgo-900 px-6 pt-12 pb-32 text-center text-white shadow-elevada sm:px-12 sm:pt-16 sm:pb-40"
  aria-labelledby="no-encontrada-titulo"
>
  <span
    class="pointer-events-none absolute -top-24 left-1/2 size-96 -translate-x-1/2 rounded-full bg-frailejon-400/15 blur-3xl"
    aria-hidden="true"
  ></span>
  <svg
    class="pointer-events-none absolute inset-x-0 bottom-0 h-28 w-full text-musgo-700/70 sm:h-36"
    viewBox="0 0 400 120"
    preserveAspectRatio="none"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      opacity="0.5"
      d="M0 70 C60 30 110 80 170 52 C230 24 280 70 330 44 C360 30 385 40 400 34 V120 H0 Z"
    />
    <path d="M0 96 C70 66 130 104 200 82 C270 60 330 98 400 74 V120 H0 Z" />
  </svg>

  <div class="relative motion-safe:animate-aparecer">
    <p
      class="font-display text-8xl leading-none font-semibold text-frailejon-400 sm:text-9xl"
      aria-hidden="true"
    >
      4<span class="inline-block motion-safe:animate-flotar">🌫️</span>4
    </p>
    <h1 id="no-encontrada-titulo" class="mt-6 text-3xl font-semibold text-white sm:text-4xl">
      Este camino se perdió en la niebla
    </h1>
    <p class="mx-auto mt-3 max-w-md text-lg text-white/85">
      La página que buscas no existe o cambió de lugar. Te ayudamos a volver.
    </p>
    <a
      [routerLink]="inicio()"
      class="mt-8 inline-flex min-h-12 items-center rounded-xl bg-frailejon-400 px-6 font-semibold text-musgo-900 transition hover:bg-frailejon-100"
    >
      {{ textoInicio() }} →
    </a>
  </div>
</section>
