<a
  href="#contenido"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-xl focus:bg-white focus:px-4 focus:py-3 focus:font-semibold focus:text-musgo-900"
>
  Saltar al contenido
</a>

<header class="sticky top-0 z-30 bg-musgo-900 text-white">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-4 sm:px-6">
    <a
      [routerLink]="inicio()"
      class="flex min-h-11 items-center gap-2 font-display text-xl font-semibold tracking-tight"
    >
      <span aria-hidden="true">🌿</span>
      Mercado Páramo
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Principal">
      @for (destino of destinos(); track destino.ruta) {
        <a
          [routerLink]="destino.ruta"
          routerLinkActive="bg-white/15"
          [routerLinkActiveOptions]="{ exact: destino.exacta ?? false }"
          ariaCurrentWhenActive="page"
          class="flex min-h-11 items-center gap-2 rounded-xl px-4 text-sm font-semibold hover:bg-white/10"
        >
          <svg [lucideIcon]="destino.icono" [size]="18" aria-hidden="true"></svg>
          {{ destino.etiqueta }}
        </a>
      }
      @if (auth.estaAutenticado()) {
        <button
          type="button"
          class="flex min-h-11 items-center gap-2 rounded-xl px-4 text-sm font-semibold hover:bg-white/10"
          (click)="salir()"
        >
          <svg lucideLogOut [size]="18" aria-hidden="true"></svg>
          Salir
        </button>
      }
    </nav>
  </div>
</header>

<main id="contenido" tabindex="-1" class="mx-auto max-w-6xl px-4 pt-6 pb-28 outline-none sm:px-6 md:pb-12">
  <router-outlet />
</main>

<nav
  class="fixed inset-x-0 bottom-0 z-30 border-t border-musgo-900/10 bg-white pb-[env(safe-area-inset-bottom)] md:hidden"
  aria-label="Principal"
>
  <ul class="mx-auto flex max-w-lg">
    @for (destino of destinos(); track destino.ruta) {
      <li class="flex-1">
        <a
          [routerLink]="destino.ruta"
          routerLinkActive="text-musgo-700 [&>span:first-child]:bg-musgo-100"
          [routerLinkActiveOptions]="{ exact: destino.exacta ?? false }"
          ariaCurrentWhenActive="page"
          class="flex min-h-16 flex-col items-center justify-center gap-0.5 px-1 text-xs font-semibold text-roca-900/75"
        >
          <span class="flex h-8 w-14 items-center justify-center rounded-full">
            <svg [lucideIcon]="destino.icono" [size]="22" aria-hidden="true"></svg>
          </span>
          <span>{{ destino.etiqueta }}</span>
        </a>
      </li>
    }
    @if (auth.estaAutenticado()) {
      <li class="flex-1">
        <button
          type="button"
          class="flex min-h-16 w-full flex-col items-center justify-center gap-0.5 px-1 text-xs font-semibold text-roca-900/75"
          (click)="salir()"
        >
          <span class="flex h-8 w-14 items-center justify-center rounded-full">
            <svg lucideLogOut [size]="22" aria-hidden="true"></svg>
          </span>
          <span>Salir</span>
        </button>
      </li>
    }
  </ul>
</nav>

<app-toast-container />
<app-confirm-dialog />
