<div
  class="pointer-events-none fixed inset-x-4 top-20 z-50 flex flex-col items-center gap-2 sm:left-auto sm:w-96 sm:items-stretch"
  role="status"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full items-start gap-3 rounded-2xl border bg-white p-4 shadow-[0_8px_30px_rgb(30_59_45/0.15)] motion-safe:animate-[toast-entrada_200ms_ease-out]"
      [class]="toast.tipo === 'error' ? 'border-peligro-600/30' : 'border-musgo-700/20'"
    >
      @switch (toast.tipo) {
        @case ('exito') {
          <svg
            [lucideIcon]="iconos.LucideCircleCheck"
            class="mt-0.5 shrink-0 text-musgo-700"
            [size]="20"
            aria-hidden="true"
          ></svg>
        }
        @case ('error') {
          <svg
            [lucideIcon]="iconos.LucideCircleAlert"
            class="mt-0.5 shrink-0 text-peligro-600"
            [size]="20"
            aria-hidden="true"
          ></svg>
        }
        @default {
          <svg
            [lucideIcon]="iconos.LucideInfo"
            class="mt-0.5 shrink-0 text-tierra-600"
            [size]="20"
            aria-hidden="true"
          ></svg>
        }
      }
      <p class="flex-1 text-sm font-medium">
        @if (toast.tipo === 'error') {
          <span class="sr-only">Error: </span>
        }
        {{ toast.mensaje }}
      </p>
      <button
        type="button"
        class="-m-3 flex size-11 shrink-0 items-center justify-center rounded-full text-roca-900/70 hover:text-roca-900"
        aria-label="Cerrar aviso"
        (click)="toastService.cerrar(toast.id)"
      >
        <svg [lucideIcon]="iconos.LucideX" [size]="18" aria-hidden="true"></svg>
      </button>
    </div>
  }
</div>
