<button
  #disparador
  type="button"
  class="flex min-h-11 items-center gap-2.5 rounded-full p-1 text-left transition hover:bg-white/10 md:pr-4"
  [attr.aria-expanded]="abierto()"
  [attr.aria-controls]="panelId"
  [attr.aria-label]="'Tu cuenta: ' + perfil().nombre + ', ' + rol()"
  (click)="alternar()"
>
  <span
    class="flex size-10 shrink-0 items-center justify-center rounded-full bg-frailejon-400 font-display text-base font-semibold text-musgo-900 ring-2 ring-white/20"
    aria-hidden="true"
  >
    {{ iniciales() }}
  </span>
  <span class="hidden leading-tight md:block" aria-hidden="true">
    <span class="block text-sm font-semibold">Hola, {{ primerNombre() }}</span>
    <span class="block text-xs text-white/75">{{ rol() }}</span>
  </span>
</button>

@if (abierto()) {
  <div
    [id]="panelId"
    class="absolute top-full right-0 z-40 mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-2xl bg-white p-4 text-roca-900 shadow-elevada ring-1 ring-musgo-900/10 motion-safe:animate-aparecer"
  >
    <div class="flex items-center gap-3">
      <span
        class="flex size-12 shrink-0 items-center justify-center rounded-full bg-frailejon-100 font-display text-lg font-semibold text-musgo-900"
        aria-hidden="true"
      >
        {{ iniciales() }}
      </span>
      <div class="min-w-0">
        <p class="font-display text-lg leading-tight font-semibold break-words text-musgo-900">
          {{ perfil().nombre }}
        </p>
        <p class="text-sm break-all text-roca-900/80">{{ perfil().email }}</p>
      </div>
    </div>
    <p class="mt-3">
      <span class="rounded-full bg-musgo-100 px-3 py-1 text-xs font-bold text-musgo-900">
        {{ rol() }}
      </span>
    </p>
    <button
      #botonSalir
      type="button"
      class="mt-4 flex min-h-12 w-full items-center justify-center gap-2 rounded-xl font-semibold text-musgo-900 ring-1 ring-musgo-900/20 ring-inset hover:bg-musgo-100"
      (click)="confirmarSalida()"
    >
      <svg [lucideIcon]="iconos.LucideLogOut" [size]="18" aria-hidden="true"></svg>
      Salir
    </button>
  </div>
}
