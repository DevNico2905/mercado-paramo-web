<dialog
  #dialogo
  class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl bg-white p-6 text-roca-900 shadow-[0_20px_60px_rgb(30_59_45/0.25)] backdrop:bg-musgo-900/50"
  aria-labelledby="confirmacion-titulo"
  aria-describedby="confirmacion-mensaje"
  (close)="confirm.responder(false)"
>
  @if (confirm.solicitud(); as solicitud) {
    <h2 id="confirmacion-titulo" class="text-xl font-semibold">{{ solicitud.titulo }}</h2>
    <p id="confirmacion-mensaje" class="mt-2">{{ solicitud.mensaje }}</p>
    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        autofocus
        class="min-h-11 rounded-xl border border-musgo-900/20 px-5 font-semibold text-musgo-900 hover:bg-musgo-100"
        (click)="confirm.responder(false)"
      >
        {{ solicitud.textoCancelar ?? 'Cancelar' }}
      </button>
      <button
        type="button"
        class="min-h-11 rounded-xl px-5 font-semibold text-white"
        [class]="
          solicitud.peligro
            ? 'bg-peligro-600 hover:bg-peligro-600/90'
            : 'bg-musgo-700 hover:bg-musgo-900'
        "
        (click)="confirm.responder(true)"
      >
        {{ solicitud.textoConfirmar ?? 'Confirmar' }}
      </button>
    </div>
  }
</dialog>
